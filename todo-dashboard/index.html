<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ========== HEADER ========== -->
  <header class="header">
    <div class="header-brand">&#9632; Life Dashboard</div>
    <button class="btn-icon" id="theme-toggle" title="Toggle dark/light mode">🌙</button>
  </header>

  <main class="dashboard">

    <!-- ========== GREETING CARD ========== -->
    <section class="card greeting-card">
      <div class="greeting-top">
        <div>
          <p id="greeting-text" class="greeting-text">Good morning!</p>
          <p id="greeting-name" class="greeting-name">Welcome back</p>
        </div>
        <div class="datetime-box">
          <p id="current-time" class="time-display">00:00:00</p>
          <p id="current-date" class="date-display">—</p>
        </div>
      </div>
      <!-- Custom name (Challenge #2) -->
      <div class="name-row" id="name-row">
        <input type="text" id="name-input" class="inline-input" placeholder="Enter your name…" maxlength="30" />
        <button class="btn-small btn-primary" id="save-name-btn">Save</button>
      </div>
    </section>

    <!-- ========== FOCUS TIMER CARD ========== -->
    <section class="card timer-card">
      <h2 class="card-title">Focus Timer</h2>

      <!-- Custom Pomodoro time (Challenge #3) -->
      <div class="timer-settings">
        <label for="pomo-minutes" class="label-sm">Session length (min):</label>
        <input type="number" id="pomo-minutes" class="num-input" min="1" max="120" value="25" />
        <button class="btn-small btn-ghost" id="apply-pomo-btn">Apply</button>
      </div>

      <div class="timer-display" id="timer-display">25:00</div>

      <div class="timer-controls">
        <button class="btn btn-primary" id="timer-start">Start</button>
        <button class="btn btn-ghost"   id="timer-stop">Stop</button>
        <button class="btn btn-ghost"   id="timer-reset">Reset</button>
      </div>
    </section>

    <!-- ========== TO-DO LIST CARD ========== -->
    <section class="card todo-card">
      <div class="card-header-row">
        <h2 class="card-title">To-Do List</h2>
        <select id="sort-select" class="select-sm">
          <option value="default">Sort: Default</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
          <option value="done">Done last</option>
        </select>
      </div>

      <!-- Add task form -->
      <form id="todo-form" class="add-row" autocomplete="off">
        <input type="text" id="todo-input" class="text-input" placeholder="Add a new task…" maxlength="120" required />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>

      <!-- Task list -->
      <ul class="todo-list" id="todo-list"></ul>
      <p class="empty-msg" id="todo-empty">No tasks yet. Add one above!</p>
    </section>

    <!-- ========== QUICK LINKS CARD ========== -->
    <section class="card links-card">
      <h2 class="card-title">Quick Links</h2>

      <!-- Add link form -->
      <form id="link-form" class="add-row link-add-row" autocomplete="off">
        <input type="text"  id="link-label" class="text-input" placeholder="Label (e.g. YouTube)" maxlength="30" required />
        <input type="url"   id="link-url"   class="text-input" placeholder="https://…" required />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>

      <!-- Links grid -->
      <div class="links-grid" id="links-grid"></div>
      <p class="empty-msg" id="links-empty">No links saved yet.</p>
    </section>

  </main>

  <!-- ========== EDIT TASK MODAL ========== -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h3 id="modal-title" class="card-title">Edit Task</h3>
      <input type="text" id="edit-input" class="text-input" maxlength="120" />
      <div class="modal-actions">
        <button class="btn btn-primary" id="modal-save-btn">Save</button>
        <button class="btn btn-ghost"   id="modal-cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
